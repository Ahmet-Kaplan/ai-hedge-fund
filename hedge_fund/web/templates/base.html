<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AI Hedge Fund{% endblock %}</title>
<style>
:root {
  --bg: #0f1115; --panel: #171a21; --line: #272c36; --text: #e6e8ec;
  --dim: #939aa8; --accent: #5ac8fa; --bench: #6b7280; --good: #34d399; --bad: #f87171;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
header { display: flex; align-items: baseline; gap: 24px; padding: 18px 28px;
  border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
header nav { display: flex; gap: 18px; flex: 1; }
header .who { color: var(--dim); font-size: 13px; }
main { padding: 28px; max-width: 1100px; }
h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--dim); margin: 32px 0 12px; font-weight: 600; }
h2:first-child { margin-top: 0; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; text-transform: uppercase;
  letter-spacing: .06em; color: var(--dim); padding: 8px 12px;
  border-bottom: 1px solid var(--line); font-weight: 600; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: none; }
.panel { background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; overflow: hidden; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); }
.good { color: var(--good); } .bad { color: var(--bad); }
.pill { display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 12px; border: 1px solid var(--line); color: var(--dim); }
.pill.running { color: var(--accent); border-color: var(--accent); }
.pill.succeeded { color: var(--good); border-color: var(--good); }
.pill.failed { color: var(--bad); border-color: var(--bad); }
form { background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 22px; max-width: 620px; }
label { display: block; margin: 16px 0 6px; font-size: 13px; color: var(--dim); }
label:first-child { margin-top: 0; }
input, select { width: 100%; padding: 9px 11px; background: var(--bg);
  border: 1px solid var(--line); border-radius: 5px; color: var(--text);
  font: inherit; }
button { margin-top: 22px; padding: 10px 20px; background: var(--accent);
  border: 0; border-radius: 5px; color: #06223a; font: inherit;
  font-weight: 700; cursor: pointer; }
button:disabled { background: var(--line); color: var(--dim); cursor: not-allowed; }
.row { display: flex; gap: 14px; }
.row > div { flex: 1; }
.chart { width: 100%; height: auto; display: block; padding: 16px 0; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .series { fill: none; stroke-width: 2; stroke-linejoin: round; }
.chart .fund { stroke: var(--accent); }
.chart .benchmark { stroke: var(--bench); stroke-dasharray: 4 4; }
.chart .ylabel { fill: var(--dim); font-size: 11px; text-anchor: end; }
.chart .xlabel { fill: var(--dim); font-size: 11px; }
.chart .xlabel.end { text-anchor: end; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px;
  overflow: hidden; }
.metric { background: var(--panel); padding: 14px 16px; }
.metric .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--dim); }
.metric .v { font-size: 19px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden;
  margin: 14px 0 8px; }
.bar > span { display: block; height: 100%; background: var(--accent);
  transition: width .4s ease; }
.notice { border: 1px solid var(--line); border-left: 3px solid var(--accent);
  background: var(--panel); padding: 12px 16px; border-radius: 5px;
  color: var(--dim); font-size: 13px; margin-bottom: 18px; }
.notice.warn { border-left-color: var(--bad); }
.empty { color: var(--dim); padding: 18px; }
legend { color: var(--dim); font-size: 12px; padding-top: 10px; }
legend span { display: inline-block; margin-right: 16px; }
legend i { display: inline-block; width: 18px; height: 2px; vertical-align: middle;
  margin-right: 6px; }
</style>
</head>
<body>
<header>
  <h1>AI HEDGE FUND</h1>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/analysts">Analysts</a>
    <a href="/simulate">New simulation</a>
  </nav>
  <span class="who">{{ principal.display }}</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
