# Small-account mode (hedge_fund/systematic/small_account.py). Research/paper only.
# A EUR 200 account cannot be expected to become EUR 5,000-10,000 in a month; the
# engine refuses trades whose expected edge does not clear their costs.
capital: 200.0
currency: EUR
fractional: true
min_order_notional: 1.0
commission_per_order: 1.0
commission_bps: 0.0
half_spread_bps: 5.0
slippage_bps: 5.0
max_positions: 3
min_edge_margin_bps: 20.0
max_annual_turnover: 4.0
ruin_level: 0.5
